{% extends "base.html" if user else "error_bare.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center;padding:48px 32px">
  <div style="font:800 64px var(--font-h);color:var(--red)">{{ code }}</div>
  <h2 style="margin:8px 0 20px">{{ msg }}</h2>
  <a class="btn" href="{{ url_for('dashboard') }}">На главную</a>
</div>
{% endblock %}
